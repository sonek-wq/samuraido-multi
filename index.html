const KANSUJI = ['一', '二', '三', '四', '五', '六'];
const stagePal = i => Object.assign({}, PAL_C, STAGES[i].pal);
// 弾き音の音程倍率（1＝標準。0.8で少し低く、1.2で少し高く）
const PARRY_PITCH = 1.0;
// 弾き音の残響（LENGTH: 残響の長さ[秒]、AMOUNT: 残響の量。0で残響なし）
const PARRY_ROOM = { LENGTH: 0.7, AMOUNT: 0.35 };

const FONT_SERIF ="'Hiragino Mincho ProN','Yu Mincho','YuMincho','MS PMincho',serif";
const FONT_SANS = "'Hiragino Kaku Gothic ProN','Yu Gothic','YuGothic','Meiryo',sans-serif";

/* ===================================================================== */
const F = FRAMES;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* =====================================================================
   サウンド（Web Audio API による合成音）
   ===================================================================== */
const Snd = {
  ctx: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -16; this.comp.knee.value = 10; this.comp.ratio.value = 5;
    this.comp.attack.value = 0.002; this.comp.release.value = 0.2;
    this.master = c.createGain(); this.master.gain.value = 0.75;
    this.master.connect(this.comp); this.comp.connect(c.destination);
    // 残響（生成したインパルス応答）
    this.rev = c.createConvolver(); this.rev.buffer = this.makeIR(2.6, 2.8);
    const rg = c.createGain(); rg.gain.value = 0.55; this.rev.connect(rg); rg.connect(this.master);
    // 短い残響（部屋鳴り程度。弾き音用）
    this.room = c.createConvolver(); this.room.buffer = this.makeIR(PARRY_ROOM.LENGTH, 4.5);
    const rmg = c.createGain(); rmg.gain.value = 0.8; this.room.connect(rmg); rmg.connect(this.master);
    // ノイズ
    const len = c.sampleRate * 2, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    // 歪み
    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = Math.tanh(4 * x) / Math.tanh(4); }
    this.distCurve = curve;
  },
  makeIR(sec, decay) {
    const c = this.ctx, len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return b;
  },
  out(send, room = 0) {
    const g = this.ctx.createGain(); g.connect(this.master);
    if (send > 0) { const s = this.ctx.createGain(); s.gain.value = send; g.connect(s); s.connect(this.rev); }
    if (room > 0) { const s = this.ctx.createGain(); s.gain.value = room; g.connect(s); s.connect(this.room); }
    return g;
  },
  chain(node, dist, filter, f1, dur, now) {
    if (dist) { const ws = this.ctx.createWaveShaper(); ws.curve = this.distCurve; node.connect(ws); node = ws; }
    if (filter) {
      const fl = this.ctx.createBiquadFilter(); fl.type = filter.type; fl.Q.value = filter.q || 0.7;
      fl.frequency.setValueAtTime(filter.f, now);
      if (filter.f1) fl.frequency.exponentialRampToValueAtTime(filter.f1, now + dur);
      node.connect(fl); node = fl;
    }
    return node;
  },
  env(g, now, attack, peak, dur) {
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(peak, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  },
  tone({ type = 'sine', f0, f1 = 0, t = 0, dur, peak, attack = 0.002, send = 0, room = 0, filter = null, dist = false }) {
    const c = this.ctx, now = c.currentTime + t;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, now);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, now + dur);
    const g = c.createGain(); this.env(g, now, attack, peak, dur);
    this.chain(o, dist, filter, 0, dur, now).connect(g); g.connect(this.out(send, room));
    o.start(now); o.stop(now + dur + 0.05);
  },
  noise({ t = 0, dur, peak, type = 'bandpass', f0 = 1000, f1 = 0, q = 1, attack = 0.001, send = 0, room = 0, dist = false }) {
    const c = this.ctx, now = c.currentTime + t;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const g = c.createGain(); this.env(g, now, attack, peak, dur);
    this.chain(s, dist, { type, f: f0, f1, q }, 0, dur, now).connect(g); g.connect(this.out(send, room));
    s.start(now, Math.random() * 1.5); s.stop(now + dur + 0.05);
  },
  metal(base, ratios, { t = 0, decay = 0.6, peak = 0.2, send = 0.3, type = 'sine' } = {}) {
    ratios.forEach((r, i) => this.tone({ type, f0: base * r, t, dur: decay * (1 - i * 0.07), peak: peak / (1 + i * 0.35), send }));
  },
  // ---- 効果音 ----
  guard() { // 控えめな「チン」
    this.noise({ dur: 0.015, peak: 0.12, type: 'highpass', f0: 4000 });
    this.tone({ f0: 2350, dur: 0.28, peak: 0.11, send: 0.12 });
    this.tone({ f0: 3530, dur: 0.16, peak: 0.04, send: 0.08 });
  },
  parry() { // 短く鈍い「ガキンッ」：音程が伸びる成分（ポォ～ン）を一切持たない、ノイズ主体の打撃音
    const k = PARRY_PITCH, rm = PARRY_ROOM.AMOUNT; // rm: 短い残響へ送る量（手応えの低音以外に少しだけ）
    // ガ：刃同士がぶつかる鈍い衝撃（中低域のノイズを歪ませる）
    this.noise({ dur: 0.06, peak: 1.0, type: 'bandpass', f0: 900 * k, q: 0.8, dist: true, room: rm });
    // 手応え：音程のない低いドスッ（正弦波を使わずノイズで作る）
    this.noise({ dur: 0.07, peak: 0.8, type: 'lowpass', f0: 260 * k, q: 0.7 });
    // キ：硬い金属の短いきしみ（非整数倍音を強く歪ませ、0.1秒以内で切る。音程は滑らせない）
    [1850, 2470, 3120, 3900].forEach((f, i) => {
      this.tone({ type: 'square', t: 0.006, f0: f * k, dur: 0.09 - i * 0.012, peak: 0.11, dist: true,
        send: 0.04, room: rm * 1.2, filter: { type: 'lowpass', f: 4500 * k } });
    });
    // ンッ：鋭い立ち上がりと、刃が擦れて止まる一瞬の軋み
    this.noise({ dur: 0.025, peak: 0.45, type: 'highpass', f0: 3000 * k });
    this.noise({ t: 0.01, dur: 0.07, peak: 0.25, type: 'bandpass', f0: 2200 * k, q: 3, dist: true, room: rm });
  },
  clash() { // 刀同士が激しくぶつかる鈍く強い音
    [[0, 330], [0.018, 290]].forEach(([dt, b]) => {
      this.metal(b, [1, 1.41, 2.13, 2.76, 3.5], { t: dt, decay: 0.42, peak: 0.28, send: 0.35, type: 'triangle' });
      this.noise({ t: dt, dur: 0.12, peak: 0.6, type: 'bandpass', f0: 1400, q: 0.6 });
    });
    this.tone({ f0: 90, f1: 38, dur: 0.35, peak: 0.95, dist: true, filter: { type: 'lowpass', f: 400 } });
    this.noise({ dur: 0.3, peak: 0.5, type: 'lowpass', f0: 900, f1: 200 });

    this.lastGuard = out.guard;

  }

    const P = this.P;

    if (myWall < 36 && Math.random() < P.corner) { // 端から脱出するため前に出る
      this.mode = 'approach'; this.targetDist = RANGE.ATK_REACH + 2; this.modeTimer = P.interval; return;
    }
    const r = Math.random();
    if (r < P.retreat) { this.mode = 'back'; this.modeTimer = 12 + randInt(0, 20); }
    else if (r < P.retreat + P.holdChance) { this.mode = 'hold'; this.holdGuard = Math.random() < P.preGuard; this.modeTimer = P.interval + randInt(0, 30); }
    else { this.mode = 'approach'; this.targetDist = RANGE.ATK_REACH + 6 + (Math.random() * 2 - 1) * P.jitter; this.modeTimer = P.interval + randInt(0, P.interval); }
  }
  think(me, frame) {
    const P = this.P, op = this.perceive();
    const out = { dir: 0, guard: false, atk: false, intent: false };
    if (!op) { this.emit(me, out); return; }
    const dist = Math.abs(op.x - me.x);
    const reach = RANGE.ATK_REACH + 8;

    if (op.state === 'guard' || op.state === 'guardstun') this.oppGuardTime++; else this.oppGuardTime = 0;
    if (me.state === 'parry' && this.prevMeState !== 'parry') this.counter = Math.random() < P.counter;
    this.prevMeState = me.state;

    // ---- 1. 相手の攻撃に反応（ガード / 弾き） ----
    const committed = me.state === 'attack' && me.phase() !== 'recovery';
    if (op.state === 'attack' && op.phase !== 'recovery' && op.atkId !== this.handledAtk) {

        const hitFrame = op.atkStart + F.ATK_STARTUP;
        if (Math.random() < P.parryChance) {

        } else {

            if (frame >= this.plan.press && !this.lastGuard) { out.guard = true; out.intent = true; this.plan.pressed = true; }

    if (me.state === 'parry' && this.counter && me.timer >= F.PARRY_CANCEL - 1) {
      out.atk = true; this.counter = false; this.emit(me, out); return;
    }

    // ---- 3. 相手の隙を突く ----

    if (opKey !== this.prevOpKey) {
      this.prevOpKey = opKey;

      else if (op.state === 'deflected' || (op.state === 'attack' && op.phase === 'recovery')) { this.punish = Math.random() < P.punish; this.punishDelay = 0; }

      if (this.punishDelay > 0) this.punishDelay--;

    }

    // ---- 4. ガードさせた後の連続攻撃（攻め立て） ----
    if (me.state === 'attack' && me.phase() === 'recovery' && this.pressAtk !== me.atkId && me.timer >= ATK_TOTAL - 4) {
      this.pressAtk = me.atkId;

    }

    // ---- 4.5 ガード連打を咎める（押した直後は弾きが出ない時間を狙う） ----
    if (P.bait && me.canAct() && dist <= reach && op.guardPress !== this.baitSeen && op.frame - op.guardPress < 6) {

    }

    // ---- 5. 立ち回り（間合い管理） ----
    if (--this.modeTimer <= 0) this.chooseMode(me);

      else if (dist < this.targetDist - 14 && !me.wallBehind()) out.dir = -me.facing;
      if (dist <= reach && me.canAct()) {
        let ch = P.attack;
        if (op.wall) ch *= 1 + P.corner;                                  // 相手が端なら攻め立てる
        if (this.oppGuardTime > 45) ch *= 1 + P.antiTurtle * 2.5;         // ガン待ちを崩しに行く
        if (Math.random() < ch) out.atk = true;
      }

      if (this.holdGuard && dist < 90) out.guard = true;
      else if (dist <= reach && Math.random() < P.attack * 0.5) out.atk = true;
      if (dist > 110) out.dir = me.facing;

      if (me.wallBehind()) this.modeTimer = 0; else out.dir = -me.facing;
    }
    this.emit(me, out);
  }
}

function resolveCombat() {

  const pA = act(p) && dist <= RANGE.ATK_REACH;

function getPose(f) {

    case 'walk': {
      const s = Math.sin(f.walkCycle * 0.2), sp = Math.round(Math.abs(s) * 2);

      P.feet = [Math.round(-s * 3.5), Math.round(s * 3.5)];           // 足は交互に前後
      P.br = Math.abs(s) > 0.6 ? 1 : 0; break;
    }
    case 'attack': {

      if (t < F.ATK_STARTUP) { // 振りかぶり
        const k = Math.min(1, t / (F.ATK_STARTUP * 0.7));
        P.hx = lerp(6, -2, k); P.hy = lerp(-21, -37, k); P.ang = lerp(28, 145, k); P.ox = -Math.round(k); P.fl = -1;
      } else if (t < F.ATK_STARTUP + F.ATK_ACTIVE) { // 斬り下ろし
        const k = (t - F.ATK_STARTUP + 1) / F.ATK_ACTIVE;
        P.hx = lerp(3, 11, k); P.hy = lerp(-33, -19, k); P.ang = lerp(105, -35, k); P.ox = 2; P.fl = 3; P.bl = -2;
        P.trail = { a0: 125, a1: P.ang };
      } else { // 硬直
        const r = t - F.ATK_STARTUP - F.ATK_ACTIVE, rem = F.ATK_RECOVERY - r;
        const k = rem < 8 ? (8 - rem) / 8 : 0;
        P.hx = lerp(11, 6, k); P.hy = lerp(-17, -21, k); P.ang = lerp(-38, 28, k); P.ox = k < 0.5 ? 2 : 1; P.fl = 3; P.bl = -2;
        if (r < 3) P.trail = { a0: 125 - r * 35, a1: -38 };
      }
      break;
    }
    // ガード：刀を頭上で横一文字に掲げる（刃は画面の奥行き方向＝短く見える）
    case 'guard': P.overhead = { x: 0, y: 0 }; P.ox = -1; P.br = breath; P.fl = 1; P.bl = -1; break;
    case 'guardstun': P.overhead = { x: -1, y: 2 }; P.ox = -2; P.oy = 1; P.bl = -2; break;
    case 'parry': P.overhead = { x: 1, y: -1 }; P.ox = 1; P.fl = 2; break;
    case 'hitstun': P.hx = 2; P.hy = -19; P.ang = 12; P.ox = -3; P.fl = -1; P.headLean = -1; break;
    case 'deflected': case 'clash': P.hx = -2; P.hy = -33; P.ang = 150; P.ox = -2; P.bl = -2; break;
    case 'broken': P.oy = 5; P.hx = 7; P.hy = -12; P.ang = -65; P.ox = Math.round(Math.sin(G.time * 0.3)); P.fl = 2; P.bl = -2; break;
    case 'win': P.hx = 6; P.hy = -17; P.ang = -30; P.br = breath; break;
  }
  return P;
}

function drawFighter(f) {
  const fc = f.facing, cx = Math.round(f.x), cy = STAGE.GROUND_Y;
  const R = (lx, ly, w, h, col) => { if (!col) return; lc.fillStyle = col; lc.fillRect(fc > 0 ? cx + lx : cx - lx - w, cy + ly, w, h); };
  const L = (x0, y0, x1, y1, col, th = 1) => {
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    const o = th >> 1;
    for (let i = 0; i <= n; i++) R(Math.round(x0 + (x1 - x0) * i / n) - o, Math.round(y0 + (y1 - y0) * i / n) - o, th, th, col);
  };
  // 影
  lc.fillStyle = 'rgba(0,0,0,0.35)'; lc.fillRect(cx - 9, cy, 18, 2);
  const pal = (f.flash > 0 && (f.flash >> 1) % 2 === 0) ? f.palW : f.pal;

  if (f.state === 'dead') { // 倒れた姿
    R(-21, -4, 6, 4, pal.skin); R(-22, -5, 3, 5, pal.hair);
    R(-15, -5, 12, 5, pal.kim); R(-15, -2, 12, 2, pal.kimD); R(-5, -5, 2, 5, pal.obi);
    R(-3, -5, 12, 5, pal.hak); R(-3, -2, 12, 2, pal.hakD); R(9, -3, 4, 3, pal.foot);
    if (pal.hat) { R(-30, -3, 8, 3, pal.hat); }
    L(6, -1, 28, -2, pal.blade);
    return;
  }

  const pose = getPose(f), ox = pose.ox, oy = pose.oy, br = pose.br;
  const top = -17 + oy, ty = -30 + oy + br;
  const hand = { x: pose.hx + ox, y: pose.hy + oy + br };

  const a = pose.ang * Math.PI / 180, dx = Math.cos(a), dy = -Math.sin(a);
  // 頭上ガード時の基準点（手前の手＝柄、奥の手＝峰を支える）
  const oh = pose.overhead ? { x: ox + pose.overhead.x, y: oy + br + pose.overhead.y } : null;
  const nearH = oh && { x: 4 + oh.x, y: -44 + oh.y }, farH = oh && { x: -6 + oh.x, y: -47 + oh.y };
  // 奥の腕
  if (oh) { L(-2 + ox, ty + 3, -4 + oh.x, -36 + oh.y, pal.kimD, 3); L(-4 + oh.x, -36 + oh.y, farH.x, farH.y + 1, pal.kimD, 3); }
  else L(-2 + ox, ty + 3, hand.x - 1, hand.y, pal.kimD, 3);
  // 鞘
  L(-1 + ox, top, -13 + ox, top + 5, pal.saya, 2);
  // 袴・脚
  // 袴：腰から裾へ釣鐘状に広がる一枚のシルエット（脚を2本に描かない）。
  //     縦の襞で袴らしさを出し、歩くと裾が前後に開閉して、足元だけが裾の下で交互にのぞく
  const hemY = -3, rows = hemY - top;
  const fb = pose.feet ? pose.feet[0] : Math.round(pose.bl * 1.3);   // 奥の足の前後位置
  const ff = pose.feet ? pose.feet[1] : Math.round(pose.fl * 1.3);   // 手前の足の前後位置
  R(-4 + fb, -2, 4, 1, pal.foot); R(-4 + fb, -1, 5, 1, pal.sandal); // 足袋と草履
  R(1 + ff, -2, 4, 1, pal.foot); R(1 + ff, -1, 5, 1, pal.sandal);
  for (let i = 0; i <= rows; i++) {
    const t = rows > 0 ? i / rows : 1, y = top + i, e = t * t;       // e: 裾に近いほど大きく広がる
    const xl = Math.round(-5 + ox * (1 - t) + (-1 + Math.min(0, pose.bl)) * e);
    const xr = Math.round(4 + ox * (1 - t) + (1 + Math.max(0, pose.fl)) * e);
    const w = xr - xl + 1;
    R(xl, y, w, 1, i === rows ? pal.hakD : pal.hak);                 // 本体（最下段は裾の縁）
    R(xl, y, 1, 1, pal.hakD); R(xr, y, 1, 1, pal.hakL);              // 背中側の陰・前側の光
    if (t > 0.2) {                                                    // 縦の襞（プリーツ）
      R(Math.round(xl + (w - 1) * 0.34), y, 1, 1, pal.hakD);
      R(Math.round(xl + (w - 1) * 0.68), y, 1, 1, pal.hakD);
    }
  }
  // 胴
  const th = top - ty + 1;
  R(-5 + ox, ty, 10, th, pal.kim); R(-5 + ox, ty, 2, th, pal.kimD); R(3 + ox, ty + 1, 2, th - 2, pal.kimL);
  R(0 + ox, ty, 3, 5, pal.under); R(1 + ox, ty, 1, 3, pal.skin);
  R(-5 + ox, top - 1, 10, 2, pal.obi);
  // 頭
  const hx0 = ox + pose.headLean, hy0 = ty - 8;
  R(-3 + hx0, hy0, 7, 8, pal.skin); R(-3 + hx0, hy0 + 6, 7, 1, pal.skinD);
  R(-4 + hx0, hy0 - 1, 4, 7, pal.hair); R(-3 + hx0, hy0 - 2, 7, 2, pal.hair);
  R(2 + hx0, hy0 + 3, 1, 1, '#111');
  if (pal.hat) { // 浪人笠（CPU）
    R(-3 + hx0, hy0 + 1, 7, 2, pal.skinD);
    R(-9 + hx0, hy0 + 1, 19, 1, pal.hatD); R(-7 + hx0, hy0 - 1, 15, 2, pal.hat);
    R(-4 + hx0, hy0 - 3, 9, 2, pal.hat); R(-1 + hx0, hy0 - 4, 3, 1, pal.hat);
    R(-6 + hx0, hy0, 3, 1, pal.hatD);
  } else { // 髷と鉢巻（プレイヤー）
    R(-1 + hx0, hy0 - 4, 3, 2, pal.hair);
    R(-4 + hx0, hy0 + 1, 8, 1, pal.band); R(-6 + hx0, hy0 + 1, 2, 1, pal.band); R(-8 + hx0, hy0 + 2, 2, 1, pal.band);
  }
  if (oh) {
    // 刀（頭上で横一文字。切っ先は画面の奥へ向くため、短く斜めに見える）
    const bx = oh.x, by = oh.y;
    L(0 + bx, -47 + by, -9 + bx, -49 + by, pal.blade);                                   // 刃（上の明るい面）
    L(0 + bx, -46 + by, -9 + bx, -48 + by, pal === f.palW ? pal.blade : '#8e9cae');      // 刃（下の陰）
    R(-10 + bx, -49 + by, 1, 1, pal.tip);                                                // 切っ先
    if ((G.time % 60) < 6) R(-4 + bx - ((G.time % 60) >> 1), -48 + by, 2, 1, '#ffffff'); // きらめき
    R(1 + bx, -48 + by, 3, 4, pal.tsuba);                                                // 鍔（ほぼ正面から見える）
    R(farH.x - 1, farH.y + 1, 3, 2, pal.skin);                                           // 奥の手（峰を支える）
    // 手前の腕：肘を前に張って柄を握る
    L(1 + ox, ty + 3, 7 + bx, -35 + by, pal.kim, 3); L(7 + bx, -35 + by, nearH.x, nearH.y, pal.kim, 3);
    R(nearH.x - 1, nearH.y - 2, 3, 3, pal.skin);                                         // 柄を握る拳
    R(nearH.x, nearH.y + 1, 2, 2, pal.tsuka);                                            // 柄頭（手前に突き出る）
  } else {
    // 刀
    L(hand.x - dx * 6, hand.y - dy * 6, hand.x, hand.y, pal.tsuka, 2);
    R(Math.round(hand.x + dx * 1.5) - 1, Math.round(hand.y + dy * 1.5) - 1, 2, 2, pal.tsuba);
    L(hand.x + dx * 3, hand.y + dy * 3, hand.x + dx * 24, hand.y + dy * 24, pal.blade);
    R(Math.round(hand.x + dx * 24), Math.round(hand.y + dy * 24), 1, 1, pal.tip);
    // 手前の腕
    L(1 + ox, ty + 3, hand.x, hand.y, pal.kim, 3);
    R(Math.round(hand.x) - 1, Math.round(hand.y) - 1, 3, 2, pal.skin);
  }

  // 斬撃の軌跡
  if (pose.trail) {
    const pv = { x: 1 + ox, y: -27 + oy };
    for (let ad = pose.trail.a0; ad >= pose.trail.a1; ad -= 4) {
      const rad = ad * Math.PI / 180, nearTip = ad - pose.trail.a1 < 40;
      const x = pv.x + Math.cos(rad) * 29, y = pv.y - Math.sin(rad) * 29;
      R(Math.round(x), Math.round(y), 2, 2, nearTip ? '#ffffff' : 'rgba(210,235,255,0.75)');
      R(Math.round(pv.x + Math.cos(rad) * 25), Math.round(pv.y - Math.sin(rad) * 25), 1, 1, 'rgba(160,210,255,0.6)');
    }
  }
  // 体幹ブレイク中の印
  if (f.state === 'broken') {
    for (let i = 0; i < 3; i++) {
      const an = G.time * 0.15 + i * 2.094;
      R(Math.round(Math.cos(an) * 8) - 1, -46 + Math.round(Math.sin(an) * 2), 2, 2, (G.time >> 2) % 2 ? '#ff3030' : '#ffb0b0');
    }
  }
}

function drawFXLow() {
  for (const r of FX.rings) {
    lc.fillStyle = r.c; lc.globalAlpha = r.life / r.max;
    const n = Math.max(12, r.r * 3 | 0);
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; lc.fillRect(Math.round(r.x + Math.cos(a) * r.r), Math.round(r.y + Math.sin(a) * r.r), 1, 1); }
    lc.globalAlpha = 1;
  }
  for (const s of FX.slashes) {
    const len = s.big ? 26 : 15, w = s.life > (s.big ? 8 : 4) ? 2 : 1;
    for (let i = -len; i <= len; i++) {
      const x = Math.round(s.x + i * s.dir), y = Math.round(s.y + i * 0.75);
      if (s.red) { lc.fillStyle = '#c00000'; lc.fillRect(x, y + 1, w + 1, w + 1); }
      lc.fillStyle = '#ffffff'; lc.fillRect(x, y, w, w);
    }
  }
  for (const p of FX.parts) { lc.fillStyle = p.c; lc.fillRect(p.x | 0, p.y | 0, p.s, p.s); }
}

function drawBar(x, y, w, h, ratio, trail, fill, hi, bgc, fromRight) {
  lc.fillStyle = '#e8d6a6'; lc.fillRect(x - 2, y - 2, w + 4, h + 4);
  lc.fillStyle = '#140c08'; lc.fillRect(x - 1, y - 1, w + 2, h + 2);
  lc.fillStyle = bgc; lc.fillRect(x, y, w, h);
  const seg = (r, col, hh = h) => { const fw = Math.round(w * clamp(r, 0, 1)); lc.fillStyle = col; lc.fillRect(fromRight ? x + w - fw : x, y, fw, hh); };
  if (trail > ratio) seg(trail, '#f4f4f4');
  seg(ratio, fill); seg(ratio, hi, 1);
}

function drawHUDLow() {
  const p = G.p, c = G.c;
  // 体幹ゲージは「残り」を表示（満タンの赤から、体幹ダメージの分だけ減っていく）
  const rest = f => 1 - f.posture / STATS.POSTURE_MAX;
  const restTrail = f => 1 - f.postureView / STATS.POSTURE_MAX;
  const pcol = f => f.state === 'broken' ? ((G.time >> 2) % 2 ? '#ff2020' : '#5a0a0a')
    : (rest(f) < 0.25 && (G.time >> 3) % 2 === 0) ? '#ff6050' : '#d82020';
  drawBar(12, 13, 116, 6, p.hp / STATS.HP_MAX, p.hpView / STATS.HP_MAX, '#f2cf2a', '#fff3a0', '#3b2c0a', false);
  drawBar(12, 23, 90, 4, rest(p), restTrail(p), pcol(p), '#ff9a8a', '#2a0808', false);
  drawBar(192, 13, 116, 6, c.hp / STATS.HP_MAX, c.hpView / STATS.HP_MAX, '#f2cf2a', '#fff3a0', '#3b2c0a', true);
  drawBar(218, 23, 90, 4, rest(c), restTrail(c), pcol(c), '#ff9a8a', '#2a0808', true);
}
// ゲージ横に減少量「－◯◯」を描く（メインキャンバス）
function renderDamageNumbers() {
  const K = SCREEN.SCALE;
  for (const d of FX.dmg) {
    const n = Math.round(d.v);
    if (n <= 0) continue;
    const left = d.f.isPlayer, hp = d.kind === 'hp';
    // 体力：体力ゲージ内側の端の上 / 体幹：「体幹」ラベルの横
    const x = (left ? (hp ? 128 : 120) : (hp ? 192 : 200)) * K;
    const y = (hp ? 6 : 25) * K + (DMG_NUM_LIFE - d.life) * 0.08;
    const size = Math.round((hp ? 20 : 18) * (1 + d.pop * 0.04));
    ctx.globalAlpha = Math.min(1, d.life / 20);
    txt('－' + n, x, y, size, hp ? '#ffe060' : '#ff7a6a', hp ? (left ? 'right' : 'left') : (left ? 'left' : 'right'));
    ctx.globalAlpha = 1;
  }
}

function txt(s, x, y, size, color, align = 'center', font = FONT_SANS, stroke = '#000', lw = 0) {
  ctx.font = `bold ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw || Math.max(3, size / 5); ctx.strokeStyle = stroke;
  ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}

/* =====================================================================
   ゲーム進行
   ===================================================================== */
// 六番勝負を最初から
function startRun() {
  G.stage = 0; G.retries = 0; G.lastLost = false;
  G.total = { hits: 0, parries: 0, clashes: 0, deathblows: 0, frames: 0 };
  newMatch();
}
// 現在の G.stage の相手と対戦を準備（体力・体幹は毎戦全快）
function newMatch() {
  const st = STAGES[G.stage];
  G.p = new Fighter(true, MOVE.START_P, PAL_P, 'あなた');
  G.c = new Fighter(false, MOVE.START_C, stagePal(G.stage), st.title);
  G.ai = new AI(st.ai);
  G.c.postureTaken = st.ai.postureTaken || 1;
  G.c.hpTaken = st.ai.hpTaken || 1;
  G.frame = 0; G.hitstop = 0; G.slow = 0; G.paused = false; G.winner = null;
  G.mode = 'stage'; G.stageT = 0; G.introT = 0;
  clearFX();
}
function addTotals() {
  for (const k of ['hits', 'parries', 'clashes', 'deathblows']) G.total[k] += G.p.stats[k];
  G.total.frames += G.frame;
}
function toTitle() { G.mode = 'title'; G.paused = false; clearFX(); }

// CPU戦の入力：キーボード＋CPUのAI
function cpuFeed() {
  G.p.input.dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  G.p.input.guard = !!keys.KeyX;
  G.ai.think(G.c, G.frame);
}
// 1フレーム分の戦闘処理。feed は入力を設定する関数（オンライン対戦では事前に設定済みなので null）
function fightStep(active, feed = cpuFeed) {
  if (G.hitstop > 0) { G.hitstop--; return; }
  if (G.slow > 0) { G.slow--; if (G.slow % 3 !== 0) return; }
  const p = G.p, c = G.c;
  if (active) {
    if (feed) feed();
  } else {
    p.input = { dir: 0, guard: false }; c.input = { dir: 0, guard: false };
    p.tapAtk = p.tapGuard = c.tapAtk = c.tapGuard = false;
  }
  p.update(c, G.frame);
  c.update(p, G.frame);
  separate(p, c);
  if (active) resolveCombat();
  if (G.ai) G.ai.record(p);
  G.frame++;
  if (active && (p.hp <= 0 || c.hp <= 0)) { G.mode = 'ko'; G.koT = 0; G.winner = p.hp > 0 ? p : c; }
}
function updateBars() {
  for (const f of [G.p, G.c]) {
    if (f.hpView > f.hp) f.hpView = Math.max(f.hp, f.hpView - 0.45);
    else if (f.hpView < f.hp) f.hpView = f.hp;        // 巻き戻しで体力が戻った場合
    // 体幹の減少分も白い残像で見せる（回復時は即座に追従）
    if (f.postureView < f.posture) f.postureView = Math.min(f.posture, f.postureView + 0.45);
    else f.postureView = f.posture;
    if (f.flash > 0) f.flash--;
  }
}

function tick() {
  G.time++;
  updateLeaves(); updateFX();
  const pr = G.pressed; G.pressed = new Set();
  const any = (...k) => k.some(x => pr.has(x));

  // オンライン：接続の見張り（定期的な往復時間の測定・無応答の検出）
  if (G.net && G.net.connected) netWatch();
  // オンライン対戦中は通信同期の処理へ
  if (G.net && G.net.inMatch) { updateBars(); netTick(any); return; }

  if (G.mode === 'title') {
    const N = TITLE_MENU.length;
    if (any('ArrowUp')) { G.sel = (G.sel + N - 1) % N; S('select'); }
    if (any('ArrowDown')) { G.sel = (G.sel + 1) % N; S('select'); }
    if (any('KeyZ', 'Enter', 'Space')) {
      S('decide');
      const id = TITLE_MENU[G.sel].id;
      if (id === 'cpu') startRun();
      else if (id === 'host') netHost();
      else { G.mode = 'lobby'; G.lobby = { phase: 'input', code: '', msg: '' }; G.typed = []; }
    }
    return;
  }
  if (G.mode === 'lobby') { lobbyTick(any); return; }
  if (G.mode === 'netmsg') {
    if (any('KeyZ', 'Enter', 'Space', 'Escape')) { S('select'); toTitle(); }
    return;
  }
  if (G.mode === 'stage') {
    G.stageT++;
    if (G.stageT === 2) S('taiko');
    if (G.stageT === 16) S('taiko', 0.0);
    if ((G.stageT > 30 && any('KeyZ', 'Enter', 'Space')) || G.stageT >= 600) { G.mode = 'intro'; G.introT = 0; }
    if (any('Escape')) toTitle();
    return;
  }
  if (G.mode === 'ending') {
    G.endT++;
    if (G.endT > 90 && any('KeyZ', 'Enter', 'Space', 'Escape')) { S('select'); toTitle(); }
    return;
  }
  updateBars();

  if (G.mode === 'intro') {
    G.introT++;
    if (G.introT === 4) S('taiko');
    if (G.introT === 58) { S('taiko'); S('taiko', 0.13); }
    if (G.introT >= F.INTRO) G.mode = 'fight';
    if (any('Escape')) toTitle();
    return;
  }
  if (G.mode === 'fight') {
    if (any('Escape')) { toTitle(); return; }
    if (any('KeyP')) G.paused = !G.paused;
    if (G.paused) return;
    fightStep(true);
    return;
  }
  if (G.mode === 'ko') {
    G.koT++;
    fightStep(false);
    if (G.koT === 26) S('gong');
    if (G.koT === 70 && G.winner.state !== 'dead') G.winner.setState('win');
    if (G.koT > 110) {
      if (any('KeyZ', 'Enter', 'Space')) {
        S('decide'); addTotals();
        const win = G.winner === G.p;
        if (!win) { const r = G.retries + 1; startRun(); G.retries = r; G.lastLost = true; } // 第一戦からやり直し（敗北回数は通算）
        else if (G.stage < STAGES.length - 1) { G.stage++; G.lastLost = false; newMatch(); } // 次の相手へ
        else { G.mode = 'ending'; G.endT = 0; S('gong'); }                     // 全勝
      } else if (any('Escape')) toTitle();
    }
  }
}

/* =====================================================================
   フレンド対戦（PeerJS によるブラウザ同士の直接通信＋ロールバック方式の同期）

   ・部屋を作った側（ホスト）が左の侍、入った側（ゲスト）が右の侍を操作する
   ・毎フレーム「入力」だけを送り合い、両者が同じ計算をして同じ試合を再現する
   ・相手の入力がまだ届いていないフレームは「直前と同じ入力」と予測して先に進め、
     実際の入力が届いて予測が外れていたら、そのフレームまで巻き戻して計算し直す
   ===================================================================== */
const NET = {
  VERSION: 4,               // 通信の取り決めの版（違う版同士はつながない）
  INPUT_DELAY: 0,           // 入力遅延（フレーム）：0＝自分の入力はオフラインと同じく即座に反映。
                            //   相手の入力の遅れはすべて予測と巻き戻しで吸収する（1〜2フレームの巻き戻しが増えるが目には見えにくい）。
                            //   相手のワープが気になる場合は 1〜2 にすると、操作が少し遅れる代わりに巻き戻しが減る
  MAX_ROLLBACK: 17,         // 予測で先行できる最大フレーム数（超えたら相手を待つ）。Wi-Fiの一瞬の遅れを止まらずに吸収する
  SEND_MAX: 60,             // 1回の送信に含める入力の最大フレーム数（相手が受け取りを確認していない分をまとめて送る）
  KEEP_FRAMES: 90,          // 自分の入力の記録を残すフレーム数
  SUM_INTERVAL: 60,         // 同期ずれの確認間隔（フレーム）
  PEER_PREFIX: 'samuraido-mp-',
  CODE_CHARS: 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', // 読み間違えやすい I L O 0 1 は使わない
  CODE_LEN: 5,
  CONNECT_TIMEOUT: 15000,   // 接続を諦めるまで（ミリ秒）
  SILENCE_TIMEOUT: 12000,   // 対戦中、相手から何も届かなければ切断とみなす（ミリ秒）
};
const IN_L = 1, IN_R = 2, IN_G = 4, IN_ATK = 8, IN_GTAP = 16; // 入力をビットで表す

const TITLE_MENU = [
  { id: 'cpu',  label: '一人で遊ぶ　六番勝負',     desc: '六人の剣客を順に破り、天下無双の座を目指せ。' },
  { id: 'host', label: 'フレンド対戦　部屋を作る', desc: '部屋コードが表示されます。相手に伝えて入ってもらいましょう。' },
  { id: 'join', label: 'フレンド対戦　部屋に入る', desc: '相手から聞いた部屋コードを入力して対戦します。' },
];

// ---- 試合状態の保存と復元（巻き戻し用） ----
const FKEYS = ['x', 'vx', 'facing', 'hp', 'posture', 'state', 'timer', 'dur', 'tapAtk', 'tapGuard', 'parryIntent',
  'atkBuffer', 'atkHit', 'atkId', 'atkStartFrame', 'guardPressFrame', 'lastGuardPress', 'parryEligible', 'guardMin',
  'guardChain', 'chainTimer', 'regenDelay', 'walkCycle', 'moveDir', 'postureTaken', 'hpTaken'];
function snapF(f) {
  const o = {}; for (const k of FKEYS) o[k] = f[k];
  o.input = { dir: f.input.dir, guard: f.input.guard }; o.stats = Object.assign({}, f.stats);
  return o;
}
function loadF(f, o) {
  for (const k of FKEYS) f[k] = o[k];
  f.input = { dir: o.input.dir, guard: o.input.guard }; f.stats = Object.assign({}, o.stats);
}
function saveState() {
  return { p: snapF(G.p), c: snapF(G.c), frame: G.frame, hitstop: G.hitstop, slow: G.slow, mode: G.mode,
    introT: G.introT, koT: G.koT, winner: G.winner === G.p ? 'p' : G.winner === G.c ? 'c' : null };
}
function loadState(s) {
  loadF(G.p, s.p); loadF(G.c, s.c);
  G.frame = s.frame; G.hitstop = s.hitstop; G.slow = s.slow; G.mode = s.mode; G.introT = s.introT; G.koT = s.koT;
  G.winner = s.winner === 'p' ? G.p : s.winner === 'c' ? G.c : null;
}
function stateSum(s) { // 同期確認用の簡単なハッシュ
  const str = JSON.stringify(s); let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return h;
}

// ---- 1フレーム分の試合進行（両者の入力ビットを与えて進める。両端末で必ず同じ結果になる） ----
function applyBits(f, b) {
  f.input.dir = (b & IN_R ? 1 : 0) - (b & IN_L ? 1 : 0);
  f.input.guard = !!(b & IN_G);
  if (b & IN_ATK) f.tapAtk = true;
  if (b & IN_GTAP) f.tapGuard = true;
}
function simFrame(b1, b2) {
  if (G.mode === 'intro') {
    G.introT++;
    if (G.introT === 4) visual('taiko1', () => S('taiko'));
    if (G.introT === 58) visual('taiko2', () => { S('taiko'); S('taiko', 0.13); });
    if (G.introT >= F.INTRO) G.mode = 'fight';
  } else if (G.mode === 'fight') {
    applyBits(G.p, b1); applyBits(G.c, b2);
    fightStep(true, null);
  } else if (G.mode === 'ko') {
    G.koT++;
    fightStep(false, null);
    if (G.koT === 26) visual('gong', () => S('gong'));
    if (G.koT === 70 && G.winner && G.winner.state !== 'dead') G.winner.setState('win');
  }
}

// ---- 接続の準備 ----
function makeCode() {
  let s = ''; for (let i = 0; i < NET.CODE_LEN; i++) s += NET.CODE_CHARS[Math.floor(Math.random() * NET.CODE_CHARS.length)];
  return s;
}
function cleanCode(t) {
  return String(t).toUpperCase().split('').filter(ch => NET.CODE_CHARS.includes(ch)).join('').slice(0, NET.CODE_LEN);
}
// PeerJSの接続先。通常は公開の無料サーバー。テスト用に ?peerhost=…&peerport=… で差し替え可能
function peerOptions() {
  const q = new URLSearchParams(location.search), o = { debug: 0 };
  if (q.get('peerhost')) {
    o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = q.get('peerpath') || '/';
    o.secure = q.get('peersecure') === '1';
  }
  return o;
}
function newNet(isHost) {
  return { isHost, peer: null, conn: null, connected: false, inMatch: false, round: 0, shown: new Set(),
    rtt: 0, lastMsg: performance.now(), pingT: 0, desync: false, rollbacks: 0, stalls: 0, remoteAhead: 0, route: '',
    fast: null, fastRecv: 0 };
}
function peerErrMsg(err) {
  const t = err && err.type;
  if (t === 'peer-unavailable') return 'その部屋は見つかりませんでした。コードを確かめてください。';
  if (t === 'browser-incompatible') return 'このブラウザは通信対戦に対応していません。';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return '接続用サーバーにつながりません。ネット接続を確認してください。';
  return '通信エラーが発生しました（' + (t || '不明') + '）。';
}
function lobbyError(msg) {
  netClose();
  G.mode = 'lobby'; G.lobby = { phase: 'error', code: '', msg };
}
// 部屋を作る
function netHost() {
  if (!window.Peer) { lobbyError('通信ライブラリを読み込めませんでした。ネット接続を確認してください。'); return; }
  netClose();
  const n = G.net = newNet(true);
  G.mode = 'lobby'; G.lobby = { phase: 'opening', code: '', msg: '' };
  const open = () => {
    if (G.net !== n) return;
    const code = makeCode();
    const peer = n.peer = new Peer(NET.PEER_PREFIX + code, peerOptions());
    peer.on('open', () => { if (G.net === n && !n.conn) { G.lobby = { phase: 'host', code, msg: '' }; } });
    peer.on('connection', conn => {
      if (G.net !== n || n.conn) { conn.on('open', () => conn.close()); return; } // 2人目以降はお断り
      netAttach(n, conn);
    });
    peer.on('error', err => {
      if (G.net !== n) return;
      if (err.type === 'unavailable-id') { peer.destroy(); open(); return; }       // コードが使用中なら作り直す
      if (n.inMatch && err.type !== 'peer-unavailable') return;                    // 対戦中のサーバー側の不調は無視
      if (!n.inMatch) lobbyError(peerErrMsg(err));
    });
    peer.on('disconnected', () => { if (G.net === n && !n.inMatch && !peer.destroyed) peer.reconnect(); });
  };
  open();
}
// 部屋に入る
function netJoin(code) {
  if (!window.Peer) { lobbyError('通信ライブラリを読み込めませんでした。ネット接続を確認してください。'); return; }
  netClose();
  const n = G.net = newNet(false);
  G.lobby = { phase: 'connecting', code, msg: '' };
  const peer = n.peer = new Peer(peerOptions());
  peer.on('open', () => {
    if (G.net !== n) return;
    // reliable:false ＝ 順番待ちをしない送り方。データが1つ欠けても、後続のデータは待たされずにすぐ届く。
    // 欠けた入力は、次の送信に含まれる「未確認の入力のまとめ」で補われる
    netAttach(n, peer.connect(NET.PEER_PREFIX + code, { reliable: false, serialization: 'json' }));
  });
  peer.on('error', err => { if (G.net === n && !n.inMatch) lobbyError(peerErrMsg(err)); });
  setTimeout(() => {
    if (G.net === n && !n.connected) lobbyError('接続できませんでした。コードを確かめるか、時間をおいて試してください。');
  }, NET.CONNECT_TIMEOUT);
}
function netAttach(n, conn) {
  n.conn = conn;
  conn.on('open', () => {
    if (G.net !== n) return;
    n.connected = true; n.lastMsg = performance.now();
    if (G.lobby) G.lobby.phase = 'connected';
    netOpenFast(n);
    netSend({ t: 'hello', v: NET.VERSION });
    setTimeout(() => netCheckRoute(n), 1500);
  });
  conn.on('data', msg => { if (G.net === n) netOnMessage(msg); });
  conn.on('close', () => { if (G.net === n) netLost('相手との接続が切れました。'); });
  conn.on('error', () => { if (G.net === n) netLost('通信エラーで接続が切れました。'); });
}
// 入力専用の高速チャンネル：再送なし・順番待ちなし。欠けた分は「未確認の入力のまとめ」で補うので再送は不要。
// （ブラウザの再送は、欠けが続くと待ち時間がどんどん延びるため、入力の送信には使わない）
// 両者が同じ番号で作る「取り決め済み」チャンネルなので、追加のやり取りなしで開く
function netOpenFast(n) {
  const pc = n.conn && n.conn.peerConnection;
  if (!pc || !pc.createDataChannel) return;
  try {
    const ch = pc.createDataChannel('samuraido-inputs', { negotiated: true, id: 100, ordered: false, maxRetransmits: 0 });
    ch.onmessage = e => { if (G.net !== n) return; try { netOnMessage(JSON.parse(e.data)); n.fastRecv++; } catch (err) { /* 壊れたデータは捨てる */ } };
    n.fast = ch;
  } catch (e) { n.fast = null; }   // 作れない環境では通常の経路で送る
}
function netSend(msg) {
  const n = G.net;
  if (n && n.conn && n.connected) { try { n.conn.send(msg); } catch (e) { /* 送れなければ切断検出に任せる */ } }
}
function netSendFast(msg) {     // 入力など、欠けてもよく速さが大事なデータ
  const n = G.net;
  if (n && n.fast && n.fast.readyState === 'open') { try { n.fast.send(JSON.stringify(msg)); return; } catch (e) { /* 通常の経路へ */ } }
  netSend(msg);
}
function netClose() {
  const n = G.net; if (!n) return;
  G.net = null;
  try { if (n.fast) n.fast.close(); } catch (e) { /* 無視 */ }
  try { if (n.conn) n.conn.close(); } catch (e) { /* 無視 */ }
  try { if (n.peer) n.peer.destroy(); } catch (e) { /* 無視 */ }
}
function netLeave() { netSend({ t: 'bye' }); netClose(); toTitle(); }   // 自分から抜ける
function netLost(msg) {                                                  // 相手側の都合で切れた
  netClose(); clearFX();
  G.mode = 'netmsg'; G.netMsg = msg;
}
// 定期処理：往復時間の測定と無応答の検出
function netWatch() {
  const n = G.net;
  if (++n.pingT % 60 === 0) netSendFast({ t: 'ping', ts: performance.now() });   // 入力と同じ経路で測る
  if (n.pingT % 600 === 0) netCheckRoute(n);

  if (performance.now() - n.lastMsg > NET.SILENCE_TIMEOUT) netLost('相手からの応答がなくなりました。');
}
function hostStart(r) { netSend({ t: 'start', r }); netStartRound(r); }
// 接続経路の判定：2台が直接つながっている（直結）か、中継サーバー経由（中継）か
function netCheckRoute(n) {
  const pc = n && n.conn && n.conn.peerConnection;
  if (!pc || !pc.getStats) return;
  pc.getStats().then(stats => {
    let pairId = null, pair = null;
    stats.forEach(s => { if (s.type === 'transport' && s.selectedCandidatePairId) pairId = s.selectedCandidatePairId; });
    stats.forEach(s => {
      if (s.type === 'candidate-pair' && (pairId ? s.id === pairId : s.nominated && s.state === 'succeeded')) pair = s;
    });
    if (!pair) return;
    const lc = stats.get(pair.localCandidateId), rc = stats.get(pair.remoteCandidateId);
    n.route = (lc && lc.candidateType === 'relay') || (rc && rc.candidateType === 'relay') ? 'relay' : 'direct';
  }).catch(() => { /* 取得できなければ表示しない */ });
}

// ---- 受信 ----
function netOnMessage(m) {
  const n = G.net;
  n.lastMsg = performance.now();
  switch (m.t) {
    case 'hello':
      if (m.v !== NET.VERSION) { netLost('相手とゲームの版が違います。両方ともページを再読み込みしてください。'); return; }
      if (n.isHost && !n.inMatch && n.round === 0) hostStart(1);
      break;
    case 'start': if (!n.isHost && m.r > n.round) netStartRound(m.r); break;
    case 'i':   // 相手の入力のまとめ：s フレーム目から順に b[] の入力。k は「相手がこちらの入力をどこまで受け取ったか」
      if (n.inMatch && m.r === n.round) {
        for (let j = 0; j < m.b.length; j++) netOnInput(m.s + j, m.b[j]);
        if (m.k > n.ackFromRemote) n.ackFromRemote = m.k;
        n.remoteAhead = m.a;
      }
      break;
    case 'ready':
      if (m.r === n.round) { n.ready.them = true; if (n.isHost && n.ready.me) hostStart(n.round + 1); }
      break;
    case 'sum':
      if (n.inMatch && m.r === n.round) { n.theirSums.set(m.f, m.s); netCheckSum(m.f); }
      break;
    case 'ping': netSendFast({ t: 'pong', ts: m.ts }); break;
    case 'pong': n.rtt = n.rtt ? n.rtt * 0.7 + (performance.now() - m.ts) * 0.3 : performance.now() - m.ts; break;
    case 'bye': netLost('相手が対戦から抜けました。'); break;
  }
}
// 相手の入力を受け取る。すでに予測で進めたフレームで予測が外れていたら、巻き戻し地点を記録
// lastRemote は「そこまで1フレームも欠けずに届いている」最後のフレーム（届く順番は前後することがある）
function netOnInput(f, b) {
  const n = G.net;
  if (f <= n.lastRemote || n.remoteIn.has(f)) return;   // 受け取り済み（まとめ送りによる重複）
  n.remoteIn.set(f, b);
  while (n.remoteIn.has(n.lastRemote + 1)) n.lastRemote++;
  if (f < n.simF && n.used.get(f) !== b && (n.rollFrom < 0 || f < n.rollFrom)) n.rollFrom = f;
}
// 自分の入力を送る：相手がまだ受け取りを確認していないフレームをすべてまとめて送る
// （1回分が欠けても次の送信で補われるので、再送を待って止まることがない）
function netSendInputs(ahead) {
  const n = G.net, last = n.simF + NET.INPUT_DELAY - 1;
  const from = Math.max(n.ackFromRemote + 1, last - NET.SEND_MAX + 1);
  const b = [];
  for (let f = from; f <= last; f++) b.push(n.localIn.get(f) || 0);
  netSendFast({ t: 'i', r: n.round, s: from, b, k: n.lastRemote, a: ahead });
}
// 相手の入力の予測：最後に届いた入力の「押しっぱなし」部分を継続（押した瞬間の入力は予測しない）
function netPredict() {
  const n = G.net, last = n.remoteIn.get(n.lastRemote) || 0;
  return last & (IN_L | IN_R | IN_G);
}

// ---- 左右の割り当て：1戦目はホストが左。再戦のたびに必ず入れ替わる ----
const hostOnLeft = r => r % 2 === 1;
function netMeLeft() { const n = G.net; return n.isHost === hostOnLeft(n.round); }
function netMe() { return netMeLeft() ? G.p : G.c; }

// ---- 試合の開始 ----
function netStartRound(r) {
  const n = G.net;
  Object.assign(n, {
    round: r, inMatch: true, simF: 0, rollFrom: -1, lastRemote: NET.INPUT_DELAY - 1, ackFromRemote: NET.INPUT_DELAY - 1,
    localIn: new Map(), remoteIn: new Map(), used: new Map(), states: new Map(),
    mySums: new Map(), theirSums: new Map(), sentSum: -1, ready: { me: false, them: false },
    pendAtk: false, pendGuard: false, stallT: 0, remoteAhead: 0,
  });
  for (let f = 0; f < NET.INPUT_DELAY; f++) { n.localIn.set(f, 0); n.remoteIn.set(f, 0); } // 最初の数フレームは無入力で確定
  G.stage = 0; G.ai = null; G.lobby = null;
  // 左右の割り当て：奇数戦はホスト（青い侍）が左、偶数戦はゲスト（赤い侍）が左。各自の侍の色はそのまま
  const hl = hostOnLeft(r);
  G.p = new Fighter(true, MOVE.START_P, hl ? PAL_P : PAL_C, '');
  G.c = new Fighter(false, MOVE.START_C, hl ? PAL_C : PAL_P, '');
  G.frame = 0; G.hitstop = 0; G.slow = 0; G.paused = false; G.winner = null;
  G.mode = 'intro'; G.introT = 0; G.koT = 0;
  clearFX();
}
// 指定フレームを計算する（計算前の状態を保存しておき、巻き戻しに使う）
function netStep(f) {
  const n = G.net;
  n.states.set(f, saveState());
  const loc = n.localIn.get(f) || 0;
  let rem = n.remoteIn.get(f);
  if (rem === undefined) rem = netPredict();
  n.used.set(f, rem);
  if (netMeLeft()) simFrame(loc, rem); else simFrame(rem, loc);
}
function sampleLocal() {
  const n = G.net; let b = 0;
  if (keys.ArrowLeft) b |= IN_L;
  if (keys.ArrowRight) b |= IN_R;
  if (keys.KeyX) b |= IN_G;
  if (n.pendAtk) b |= IN_ATK;
  if (n.pendGuard) b |= IN_GTAP;
  n.pendAtk = n.pendGuard = false;
  return b;
}

// ---- 毎フレームの同期処理 ----
function netTick(any) {
  const n = G.net;
  if (any('Escape')) { netLeave(); return; }

  // 1. 予測が外れていたら、そのフレームまで巻き戻して現在まで計算し直す
  if (n.rollFrom >= 0) {
    const from = n.rollFrom, to = n.simF, st = n.states.get(from);
    n.rollFrom = -1;
    if (st) { loadState(st); for (let f = from; f < to; f++) netStep(f); n.rollbacks++; }
  }

  // 2. 決着後の再戦（両者がZを押したらホストが次の試合を始める）
  if (G.mode === 'ko' && G.koT > 110 && !n.ready.me && any('KeyZ', 'Enter', 'Space')) {
    n.ready.me = true; S('decide');
    netSend({ t: 'ready', r: n.round });
    if (n.isHost && n.ready.them) { hostStart(n.round + 1); return; }
  }

  // 3. 相手より先に進みすぎていたら待つ
  const ahead = n.simF - n.lastRemote;
  if (ahead > NET.MAX_ROLLBACK) {
    n.stallT++; n.stalls++;
    if (n.stallT % 3 === 1) netSendInputs(ahead);   // 待っている間も送り続け、相手側の欠けを補う
    return;
  }
  n.stallT = 0;
  // 4. 時間合わせ：自分の方が相手より明らかに先行しているときは、ときどき1フレーム休む
  if (ahead - n.remoteAhead >= 3 && G.time % 2 === 0) { if (G.time % 4 === 0) netSendInputs(ahead); return; }

  // 5. 自分の入力を採取して送り、1フレーム進める
  const lf = n.simF + NET.INPUT_DELAY, b = sampleLocal();
  n.localIn.set(lf, b);
  netStep(n.simF);
  n.simF++;
  netSendInputs(ahead);

  // 6. 同期ずれの確認（両者の入力が確定したフレームの状態を比べる）
  const conf = Math.min(n.lastRemote + 1, n.simF - 1);
  for (let f = (Math.floor(n.sentSum / NET.SUM_INTERVAL) + 1) * NET.SUM_INTERVAL; f <= conf; f += NET.SUM_INTERVAL) {
    const st = n.states.get(f);
    n.sentSum = f;
    if (!st) continue;
    const s = stateSum(st);
    n.mySums.set(f, s);
    netSend({ t: 'sum', r: n.round, f, s });
    netCheckSum(f);
  }
  // 7. 古い記録を捨てる
  const old = n.simF - 40;
  for (const mp of [n.states, n.used, n.remoteIn]) for (const k of mp.keys()) if (k < old) mp.delete(k);
  const oldLocal = n.simF - NET.KEEP_FRAMES;
  for (const k of n.localIn.keys()) if (k < oldLocal) n.localIn.delete(k);
}
function netCheckSum(f) {
  const n = G.net, a = n.mySums.get(f), b = n.theirSums.get(f);
  if (a !== undefined && b !== undefined && a !== b) n.desync = true;
}

// ---- ロビー（部屋を作る／入る画面）の操作 ----
function lobbyTick(any) {
  const L = G.lobby;
  if (!L) { toTitle(); return; }
  if (L.phase === 'input') {
    for (const ch of G.typed) if (NET.CODE_CHARS.includes(ch) && L.code.length < NET.CODE_LEN) L.code += ch;
    G.typed = [];
    if (any('Backspace')) L.code = L.code.slice(0, -1);
    if (any('Enter', 'NumpadEnter') && L.code.length === NET.CODE_LEN) { S('decide'); netJoin(L.code); }
    if (any('Escape')) toTitle();
    return;
  }
  if (L.phase === 'error') { if (any('KeyZ', 'Enter', 'Space', 'Escape')) { S('select'); toTitle(); } return; }
  if (L.phase === 'host' && any('KeyC') && navigator.clipboard) {
    navigator.clipboard.writeText(L.code).then(() => { if (G.lobby === L) L.msg = 'コードをコピーしました'; }, () => {});
  }
  if (any('Escape')) netLeave();
}

/* ---- 入力 ---- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyZ', 'KeyX'].includes(e.code)) e.preventDefault();
  Snd.init();
  keys[e.code] = true;
  if (e.repeat) return;
  G.pressed.add(e.code);
  if (G.net && G.net.inMatch) {                       // オンライン：押した瞬間を次の送信入力に載せる
    if (e.code === 'KeyZ') G.net.pendAtk = true;
    if (e.code === 'KeyX') G.net.pendGuard = true;
  } else if (G.mode === 'fight' && !G.paused && G.p) { // CPU戦
    if (e.code === 'KeyZ') G.p.tapAtk = true;
    if (e.code === 'KeyX') G.p.tapGuard = true;
  }
  if (G.mode === 'lobby' && G.lobby && G.lobby.phase === 'input' && e.key.length === 1) G.typed.push(e.key.toUpperCase());
});
// 部屋コードの貼り付け
window.addEventListener('paste', e => {
  if (G.mode !== 'lobby' || !G.lobby || G.lobby.phase !== 'input') return;
  const t = (e.clipboardData && e.clipboardData.getData('text')) || '';
  G.lobby.code = cleanCode(t);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
window.addEventListener('mousedown', () => Snd.init());

/* ---- 画面サイズ合わせ ---- */
function fit() {
  const s = Math.min(window.innerWidth / cv.width, window.innerHeight / cv.height);
  cv.style.width = Math.floor(cv.width * s) + 'px';
  cv.style.height = Math.floor(cv.height * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---- メインループ（requestAnimationFrame + 固定60fps更新） ---- */
const STEP = 1000 / 60;
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { acc -= STEP; tick(); }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
